<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-black text-white">
    <div class="flex justify-center items-center h-[100dvh]">
      <div
        class="bg-white text-black w-[350px] h-auto flex items-center justify-center flex-col p-5 relative rounded-xl"
      >
        <div
          class="box w-[100%] h-52 bg-red-900 text-white absolute top-0 rounded-xl rounded-b-none"
        ></div>
        <img
          src="https://i.pravatar.cc/150?img=3"
          alt=""
          class="rounded-[360px] z-10"
        />
        <h1 class="text-[26px] font-bold z-10 text-white">Coding Lab</h1>
        <p class="z-10">Youtuber and Frontend Developer</p>

        <div class="flex gap-3 m-3 z-10">
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/facebook.svg"
            alt="Facebook"
            class="w-6 h-6 bg-white"
          />
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/twitter.svg"
            alt="Twitter"
            class="w-6 h-6 bg-white"
          />
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/instagram.svg"
            alt="Instagram"
            class="w-6 h-6 bg-white"
          />
          <img
            src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/youtube.svg"
            alt="Instagram"
            class="w-6 h-6 bg-white"
          />
        </div>
        <div class="flex flex-row justify-start items-center gap-5 z-10">
          <button
            class="bg-[blue] text-white w-35 h-10 rounded-[360px] capitalize"
          >
            subscribe
          </button>
          <button
            class="bg-[blue] text-white w-35 h-10 rounded-[360px] capitalize"
          >
            message
          </button>
        </div>
        <div class="flex justify-around w-full mt-5">
          <div class="flex">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24"
              class="hati w-6 h-6 text-red-500"
            >
              <path
                fill-rule="evenodd"
                d="M11.645 20.91l-.008-.003-.027-.015a21.59 21.59 0 01-1.162-.682 26.75 26.75 0 01-4.334-3.287C3.688 14.034 2 11.611 2 8.75 2 6.126 4.126 4 6.75 4c1.586 0 3.06.777 3.974 2.03h.553A4.751 4.751 0 0115.25 4C17.874 4 20 6.126 20 8.75c0 2.861-1.688 5.284-4.114 8.173a26.75 26.75 0 01-4.334 3.287 21.59 21.59 0 01-1.162.682l-.027.015-.008.003a.75.75 0 01-.678 0z"
                clip-rule="evenodd"
              />
            </svg>
            <span>10k</span>
          </div>
          <div class="flex">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              class="lonceng w-6 h-6 text-yellow-500"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
              />
            </svg>
            <span>20k</span>
          </div>
          <div class="flex">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24"
              class="share w-6 h-6 text-gray-600"
            >
              <path
                d="M16.5 4.5a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zM16.5 19.5a2.25 2.25 0 11-4.5 0 2.25 2.25 0 014.5 0zM6 12a2.25 2.25 0 114.5 0A2.25 2.25 0 016 12z"
              />
              <path
                d="M8.25 12a.75.75 0 01.75-.75h6.614l-2.865-2.865a.75.75 0 111.06-1.06l4.25 4.25a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 11-1.06-1.06l2.865-2.865H9a.75.75 0 01-.75-.75z"
              />
            </svg>
            <span>20k</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
